<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dennis Vault</title>
    <style>
        body {
            box-sizing: border-box;
            color: #152033;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 8px;
        }

        p {
            color: #475569;
            font-size: 14px;
            margin: 0 0 14px;
        }

        input {
            box-sizing: border-box;
            font-size: 18px;
            letter-spacing: 2px;
            padding: 10px;
            width: 100%;
        }

        button {
            font-size: 15px;
            margin-top: 14px;
            padding: 10px 12px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Dennis Vault</h1>
    <p id="message">Enter your TOTP code.</p>
    <input id="otp" inputmode="numeric" autocomplete="one-time-code" autofocus>
    <button id="unlock">Unlock</button>
    <script src="dennis_otp.js"></script>
</body>
</html>
